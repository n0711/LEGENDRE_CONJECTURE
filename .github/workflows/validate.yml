name: Reproducible validation

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install mpmath pytest
      - run: python scripts/run_validation.py
      - run: python python/legendre_analysis.py --n-max 100 --output-dir data/smoke
      - run: python scripts/research_diagnostics.py
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_cpp.py
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl -fsSL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.8.0/lean-4.8.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.8.0-linux/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependencies and selected Mathlib cache
        working-directory: lean
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: |
          lake update
          lake exe cache get Mathlib/Analysis/SpecialFunctions/Log/Basic.lean Mathlib/Data/Nat/Prime.lean Mathlib/NumberTheory/ArithmeticFunction.lean Mathlib/Order/Interval/Finset/Nat.lean Mathlib/Tactic/FieldSimp.lean Mathlib/Tactic/Linarith.lean Mathlib/Tactic/Positivity.lean Mathlib/Tactic/Ring.lean
      - name: Compile and audit every theorem
        run: python3 lean/audit.py
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-xetex
      - run: |
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=paper paper/legendre_research.tex
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=paper paper/legendre_research.tex
