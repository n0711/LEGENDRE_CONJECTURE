name: Reproducible validation

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install mpmath pytest
      - run: python -m pytest python/tests -q
      - run: python python/legendre_analysis.py --n-max 10000 --output-dir data
